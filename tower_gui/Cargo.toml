[package]
name = "tower_gui"
version = "0.1.0"
edition = "2021"
description = "GUI browser for qcom.towers.v4 JSON dumps"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }

[profile.release]
# thin LTO — full LTO makes the last link step feel "stuck" for minutes
lto = "thin"
